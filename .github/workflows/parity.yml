# .github/workflows/parity.yml
#
# Phase 24 (TEST-01/TEST-02/PKG-04, D-14): the WIKI_IMPL=[bash,py] parity matrix.
# NEW jobs with NEW names — none of the 6 required-check names (lint, privacy-leak,
# strict, skills-check, neutrality, setup-parity) is renamed or matrixed here.
#
#   parity-suites (bash) / parity-suites (py)
#     Runs the ENUMERATED suite list (09 09.1 10 11 12.1 12.2 13 15 18 20 22 23 24 —
#     REVIEWS HIGH#5/RB-5) under each impl via tests/run-all-suites.sh with the per-test
#     no-regression check vs tests/SUITE_MANIFEST.txt, plus the no-direct-call gate.
#     In Phase 24 py is green-by-fallthrough (tests/ported.manifest empty); each Phase-25
#     port lights its parity up with ZERO edits here (D-14/D-08).
#
#   parity-equivalence
#     Captures per-call channels on BOTH impls (IT_CAPTURE_DIR self-record from black-box
#     child tests — cycle-3 finding #2) and BYTE-compares stdout/stderr/exit/tree across
#     impls with pid-independent pairing (REVIEWS HIGH#4 / cycle-6 fix #4 / TEST-01).
#
# Python 3.14 on these NEW jobs (RB-2: matches the golden-capture interpreter; the 6
# required jobs keep their existing 3.12 unchanged — PKG-04 additive-only).
name: Parity Matrix (WIKI_IMPL bash|py)

on:
  pull_request:
  push:
    branches: [main]

jobs:
  parity-suites:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        impl: [bash, py]
    steps:
      - uses: actions/checkout@v6
        with:
          # REVIEW FIX: the worktree oracle resolves tests/freeze-baseline.sha (the local-only
          # tag is never pushed); a depth-1 clone cannot reach that commit — today the oracle
          # would silently fall back to HEAD (not held-fixed), and the first Phase-25 manifest
          # append would hard-fail every job on the N-4 guard.
          fetch-depth: 0
      - id: harness
        # REVIEW FIX (finding C3): the release template ships .github wholesale but NOT
        # tests/run-all-suites.sh + the enumerated suites (only tests/lib rides the allowlist).
        # On a template fork this maintainer-only parity job must NEUTRAL-SKIP, not fail red.
        run: |
          if [ -f tests/run-all-suites.sh ] && [ -f tests/SUITE_MANIFEST.txt ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "parity harness not shipped (template checkout) — skipping (not a failure)"
          fi
      - uses: actions/setup-python@v6
        if: steps.harness.outputs.present == 'true'
        with:
          python-version: '3.14'
      - name: Install the compendium package (pinned deps)
        if: steps.harness.outputs.present == 'true'
        run: pip install -e .
      - name: Install poppler + jq (suite deps)
        if: steps.harness.outputs.present == 'true'
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils jq
      - name: No-direct-bin-call gate (seam-routing invariant)
        if: steps.harness.outputs.present == 'true'
        run: bash tests/lib/no-direct-bin-calls.sh
      - name: Seam self-tests
        if: steps.harness.outputs.present == 'true'
        run: |
          bash tests/lib/test_normalize.sh
          bash tests/lib/test_invoke_tool_seterm.sh
          bash tests/lib/test_capture_dir.sh
          bash tests/lib/test_shim_smoke.sh
          bash tests/lib/test_invoke_tool_selfparity.sh
          bash tests/lib/test_oracle_scriptrelative.sh
      - name: Run enumerated suites (per-test no-regression)
        if: steps.harness.outputs.present == 'true'
        run: WIKI_IMPL=${{ matrix.impl }} bash tests/run-all-suites.sh

  common-freeze:
    # Phase 24 Plan 06 (D-07/D-08): the frozen-foundation guard in CI. NEW name (not one of
    # the 6 required checks). fetch-depth: 0 — the guard diffs against the committed baseline
    # SHA (tests/freeze-baseline.sha; the local-only phase-24-freeze tag is never pushed).
    # Exit 3 (unreachable baseline) is a NEUTRAL logged skip, never a vacuous pass — captured
    # with the same non-`!` idiom the hook uses (REVIEWS HIGH#2/HIGH#12).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Frozen-foundation guard (exit 3 = neutral skip, not a pass)
        run: |
          if bash bin/check-common-freeze.sh; then rc=0; else rc=$?; fi
          if [ "$rc" = "3" ]; then
            echo "freeze baseline unreachable on this branch — skipping (not a pass)"
            exit 0
          fi
          exit "$rc"

  parity-equivalence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # REVIEW FIX: the worktree oracle resolves tests/freeze-baseline.sha (the local-only
          # tag is never pushed); a depth-1 clone cannot reach that commit — today the oracle
          # would silently fall back to HEAD (not held-fixed), and the first Phase-25 manifest
          # append would hard-fail every job on the N-4 guard.
          fetch-depth: 0
      - id: harness
        # REVIEW FIX (finding C3): neutral-skip on a template fork that did not ship the harness.
        run: |
          if [ -f tests/run-all-suites.sh ] && [ -f tests/SUITE_MANIFEST.txt ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "parity harness not shipped (template checkout) — skipping (not a failure)"
          fi
      - uses: actions/setup-python@v6
        if: steps.harness.outputs.present == 'true'
        with:
          python-version: '3.14'
      - name: Install the compendium package (pinned deps)
        if: steps.harness.outputs.present == 'true'
        run: pip install -e .
      - name: Install poppler + jq (suite deps)
        if: steps.harness.outputs.present == 'true'
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils jq
      - name: Capture channels (bash leg)
        if: steps.harness.outputs.present == 'true'
        run: WIKI_IMPL=bash bash tests/run-all-suites.sh --capture-channels /tmp/bashch
      - name: Capture channels (py leg)
        if: steps.harness.outputs.present == 'true'
        run: WIKI_IMPL=py bash tests/run-all-suites.sh --capture-channels /tmp/pych
      - name: Byte-compare channels across impls (pid-independent pairing)
        if: steps.harness.outputs.present == 'true'
        run: bash tests/run-all-suites.sh --require-parity /tmp/bashch /tmp/pych
